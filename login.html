<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
</head>

<body>

    <center>
    <h1>MicroFinance Management</h1>
    <h2>User Login</h2>
    <h3>Login Details</h3>
    </center>

    <br>

    <form>

    <center>
    <fieldset>
        <table>
            <tr>
                <td>Username:</td>
                <td>
                    <input type="text" name="username" required>
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password" name="password" required>
                </td>
            </tr>
        </table>
    </fieldset>
    </center>

        <br>

        <center>
            <button type="submit">Login</button>
            <button type="reset">Reset</button>
        </center>

        <p>
            <center>
                Don't have an account?
                <a href="accountantregistration.html">Register Here</a>
            </center>
        </p>

    </form>

</body>
</html>
